<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kontakta mig</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>


    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <a href="index.html">Fotograf Wennergren</a>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html">Hem</a></li>
                <li><a href="portfolio.html">Portfolio</a></li>
                <li><a href="om.html">Om mig</a></li>
                <li><a href="kontakta.html" class="active">Kontakta mig</a></li>
            </ul>
        </div>
    </nav>


    <section class="page-header">
        <h1>Kontakta mig</h1>
        <p>Jag hör gärna från dig</p>
    </section>


    <main class="content-wrapper">
        <section class="contact-section">
            <div class="contact-info">
                <div class="info-item">
                    <h3>E-post</h3>
                    <p><a href="mailto:ville@wgrn.se">ville@wgrn.se</a></p>
                </div>
                <div class="info-item">
                    <h3>Telefon</h3>
                    <p><a href="tel:+46793358151">+46 79 335 81 51</a></p>
                </div>
                <div class="info-item">
                    <h3>Fredriksdalsgatan 13</h3>
                    <p>Göteborg, Sverige</p>
                </div>
            </div>

            <div class="contact-form-section">
                <h2>Skicka ett meddelande</h2>
                <form class="contact-form">
                    <div class="form-group">
                        <label for="name">Namn</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">E-post</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="message">Meddelande</label>
                        <textarea id="message" name="message" rows="6" required></textarea>
                    </div>
                    <button type="submit" class="submit-btn">Skicka</button>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Alla rättigheter förbehållna.</p>
    </footer>

</body>
</html>
